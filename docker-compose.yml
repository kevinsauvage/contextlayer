services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: contextlayer
      POSTGRES_PASSWORD: contextlayer
      POSTGRES_DB: contextlayer
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextlayer -d contextlayer"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
