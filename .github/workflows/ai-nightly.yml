name: AI nightly

# Manual only: the schedule is off until AI credit is set aside for it (DECISIONS.md, 2026-11-17).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  injection-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The eval skips itself without a model, which would make a missing secret look like a pass.
      - name: Check the eval credentials
        run: test -n "$AI_API_KEY" || { echo "AI_API_KEY secret is missing"; exit 1; }
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
      - name: Prompt-injection subset
        run: pnpm eval tests/evaluation/injection.eval.ts
        env:
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ vars.AI_EVAL_MODEL || 'deepseek-flash' }}
          AI_STRUCTURED_OUTPUTS: "false"
          AI_JUDGE_BASE_URL: ${{ secrets.AI_JUDGE_BASE_URL || secrets.AI_BASE_URL }}
          AI_JUDGE_API_KEY: ${{ secrets.AI_JUDGE_API_KEY || secrets.AI_API_KEY }}
          AI_JUDGE_MODEL: ${{ vars.AI_EVAL_JUDGE_MODEL || 'deepseek-v4-pro' }}
          AI_JUDGE_STRUCTURED_OUTPUTS: "false"
