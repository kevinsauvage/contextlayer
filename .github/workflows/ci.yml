name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Retrieval fixtures read this repository at a pinned commit, which a shallow clone would not have.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # High and critical only: the one moderate finding is a dev-only esbuild reached through drizzle-kit, which
      # better-auth lists as an optional peer, so it cannot ship. Drop `--audit-level` when upstream fixes it.
      - run: pnpm audit --prod --audit-level high
      - run: pnpm format:check
      # Typecheck first: `next typegen` writes the route types (PageProps, LayoutProps) that lint resolves.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm deps:check
      - run: pnpm test:coverage
      - run: pnpm build
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-1234
          BETTER_AUTH_URL: http://localhost:3000
          ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
